name: MHT-CET PCM Score Card Checker

on:
  schedule:
    - cron: "*/15 * * * *"      # Actually runs every 15 minutes
  workflow_dispatch:            # Manual trigger from Actions tab

jobs:
  check-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Score Card checker
        env:
          MHTCET_EMAIL:        ${{ secrets.MHTCET_EMAIL }}
          MHTCET_PASSWORD:     ${{ secrets.MHTCET_PASSWORD }}
          TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER:  ${{ secrets.TWILIO_FROM_NUMBER }}
          YOUR_PHONE_NUMBER:   ${{ secrets.YOUR_PHONE_NUMBER }}
        run: python checker.py

      - name: Upload debug screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          if-no-files-found: ignore
          
